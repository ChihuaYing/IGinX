# 各服务的默认值，<engine>-meta.properties 只需写与此不同的项
# 是否 https
secure=false
# 是否使用虚拟主机风格（桶名在域名中），false 为路径风格（桶名在路径中）
virtual_style=false
# 为 true 时未配置 region 直接报错
region_required=false
# data_bucket 不存在时是否创建
auto_create_bucket=true
# 注册时是否保留 ip 处填写的域名，false 时由 IGinX 解析为 IP；virtual_style 为 true 时总是保留
preserve_host=false
