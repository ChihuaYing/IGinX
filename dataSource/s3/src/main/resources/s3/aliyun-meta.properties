# 阿里云 OSS 配置
# OSS 只接受虚拟主机风格；SDK 的建桶和 GetBucketLocation 请求总是路径风格，所以必须配置 region，且不自动建桶
secure=true
virtual_style=true
region_required=true
auto_create_bucket=false
# 只能用域名访问（虚拟主机风格、TLS 证书），即使改为路径风格也保留域名
preserve_host=true
